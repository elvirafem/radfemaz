<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qırmızı Xətt — Məqalələr</title>
<meta name="description" content="Radikal feminist nəzəriyyəyə giriş məqalələri.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__top">
    <span>Buraxılış — 01</span>
    <span>Azərbaycan, 2026</span>
  </div>
  <a href="index.html" class="masthead__title">QIRMIZI XƏTT</a>
  <p class="masthead__tagline">Radikal Feminist Nəşr və Təşkilatlanma</p>
  <nav class="primary" aria-label="Əsas naviqasiya">
    <a href="index.html">Ana Səhifə</a>
    <a href="about.html">Haqqımızda</a>
    <a href="articles.html" aria-current="page">Məqalələr</a>
    <a href="contact.html">Əlaqə</a>
  </nav>
</header>

<div class="torn" role="presentation"></div>

<main>
  <p class="eyebrow">Məqalələr</p>
  <h1 class="page-title">Giriş mətnləri</h1>

  <div id="articles-list"><p class="empty-state">Hələ dərc edilmiş məqalə yoxdur.</p></div>
</main>

<div class="torn torn--garnet" role="presentation"></div>

<footer>
  <span>© 2026 Qırmızı Xətt</span>
  <span>Mətnlər izahsız istifadə üçün açıqdır</span>
</footer>

<script src="site.js"></script>
<script src="data/articles.js"></script>
<script>
function renderArticles() {
  const container = document.getElementById('articles-list');
  if (!ARTICLES.length) return;

  const sorted = [...ARTICLES].sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));

  container.innerHTML = sorted.map(a => `
    <article class="article-entry prose">
      <h2><a href="article.html?slug=${encodeURIComponent(a.slug)}">${escapeHtml(a.title)}</a></h2>
      <p>${escapeHtml(a.excerpt || '')}</p>
      <a class="read-more" href="article.html?slug=${encodeURIComponent(a.slug)}">Ətraflı oxu →</a>
    </article>
  `).join('');
}

renderArticles();
</script>

</body>
</html>
